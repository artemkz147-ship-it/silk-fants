name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: silk-fants-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Silk Fants ${{ github.ref_name }}
          body: |
            ## Шёлковые фанты ${{ github.ref_name }}

            Android debug APK (sideload).

            Карточная игра для пар: 50 фантазийных заданий без проникновения.
            18+ / NSFW. Возрастной гейт при первом запуске.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
